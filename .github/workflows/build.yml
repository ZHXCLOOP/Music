name: Build Music Phone Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: بناء المود
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. سحب الملفات من المستودع
        uses: actions/checkout@v4

      - name: 2. تثبيت Java 17 لماينكرافت 1.20.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. تجهيز أداة البناء Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: 4. بناء المود
        run: gradle build --no-daemon --stacktrace

      - name: 5. رفع ملف المود الجاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: musicphone-jar
          path: build/libs/*.jar
          if-no-files-found: error
          
